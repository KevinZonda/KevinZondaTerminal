# /etc/nginx/sites-available/kterm
# Change the server_name, then enable this file from sites-enabled.
# Add TLS here (or with Certbot) when KTerm is exposed outside a trusted network.
# This example assumes Nginx can reach KTerm on its own loopback interface.
server {
    listen 80;
    listen [::]:80;
    server_name terminal.example.com;

    location = /ws {
        proxy_pass http://127.0.0.1:7132;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:7132;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
