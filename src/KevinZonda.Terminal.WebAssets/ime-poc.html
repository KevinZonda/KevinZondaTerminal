<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>KTerm IME input PoC</title>
    <style>
      body { margin: 24px; font: 14px system-ui, sans-serif; background: #161b22; color: #e6edf3; }
      p { max-width: 850px; line-height: 1.5; }
      button { margin: 0 8px 12px 0; padding: 7px 12px; }
      #terminal { width: min(850px, 100%); height: 240px; margin-bottom: 16px; }
      #log { height: 310px; overflow: auto; padding: 12px; background: #0d1117; white-space: pre-wrap; font: 12px ui-monospace, monospace; }
    </style>
  </head>
  <body>
    <h1>KTerm IME input PoC</h1>
    <p>点击终端，分别在英文和中文输入法下输入 <code>? ？ ， ｜ + *</code>。
      下面同时记录浏览器事件与 xterm 的 onData。合成事件按钮只验证处理路径，不能代替真实输入法测试。
      在网址末尾加 <code>?fix=1</code> 可启用修复作对照。</p>
    <div id="terminal"></div>
    <button id="synthetic-229">模拟 Process / 229 + ？</button>
    <button id="synthetic-191">模拟 Process / 191 + ？</button>
    <button id="synthetic-comma">模拟 ， / 188</button>
    <button id="clear">清空记录</button>
    <button id="copy">复制记录</button>
    <pre id="log"></pre>
    <script type="module" src="/src/ime-poc.ts"></script>
  </body>
</html>
