name: Build Linux

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref to check out when called by another workflow
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: build-linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ inputs.source_ref == '' }}

jobs:
  build:
    name: Build Linux x64
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.9
        with:
          version: 10.33.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/KevinZonda.Terminal.Web/pnpm-lock.yaml

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Install frontend dependencies
        run: pnpm --dir src/KevinZonda.Terminal.Web install --frozen-lockfile

      - name: Restore .NET dependencies
        run: |
          dotnet restore tests/KevinZonda.Terminal.UnixPty.Tests --nologo
          dotnet restore tests/KevinZonda.Terminal.AvaloniaDesktop.Tests --nologo
          dotnet restore \
            src/KevinZonda.Terminal.AvaloniaDesktop/KevinZonda.Terminal.AvaloniaDesktop.csproj \
            --runtime linux-x64 \
            --nologo

      - name: Verify C# formatting
        run: >-
          dotnet format
          src/KevinZonda.Terminal.AvaloniaDesktop/KevinZonda.Terminal.AvaloniaDesktop.csproj
          --verify-no-changes
          --no-restore

      - name: Test Unix PTY
        run: >-
          dotnet run
          --project tests/KevinZonda.Terminal.UnixPty.Tests
          --configuration Release
          --no-launch-profile
          --no-restore

      - name: Test Avalonia desktop services
        run: >-
          dotnet run
          --project tests/KevinZonda.Terminal.AvaloniaDesktop.Tests
          --configuration Release
          --no-launch-profile
          --no-restore

      - name: Publish self-contained application
        run: >-
          dotnet publish
          src/KevinZonda.Terminal.AvaloniaDesktop/KevinZonda.Terminal.AvaloniaDesktop.csproj
          --configuration Release
          --runtime linux-x64
          --self-contained true
          --output artifacts/package/KevinZonda-Terminal-linux-x64
          --nologo

      - name: Verify published executables
        shell: bash
        run: |
          set -euo pipefail
          publish_dir="artifacts/package/KevinZonda-Terminal-linux-x64"
          test -x "$publish_dir/kterm"
          test -x "$publish_dir/kterm-pty-helper"
          file "$publish_dir/kterm"
          file "$publish_dir/kterm-pty-helper"

      - name: Package application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/dist
          tar \
            -C artifacts/package \
            -czf artifacts/dist/KevinZonda-Terminal-linux-x64.tar.gz \
            KevinZonda-Terminal-linux-x64
          ls -lh artifacts/dist/KevinZonda-Terminal-linux-x64.tar.gz

      - name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: artifacts/dist/KevinZonda-Terminal-linux-x64.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 30
